id: test.buy_fast_food
handler: test.purchase_fast_food

parameters:
  price: 8
  portions: 1
  durationMinutes: 2

preconditions:
  - {fact: shops.fast_available}
  - op: gte
    args:
      - {fact: finance.money}
      - {parameter: price}
  - op: lt
    args:
      - {fact: inventory.food_count}
      - {parameter: portions}

duration:
  unit: simulationMinutes
  estimate: {parameter: durationMinutes}

prediction:
  - fact: finance.money
    op: subtract
    value: {parameter: price}
  - fact: inventory.food_count
    op: add
    value: {parameter: portions}

completion:
  - op: gte
    args:
      - {fact: inventory.food_count}
      - {parameter: portions}

cost:
  expression:
    op: add
    args:
      - {calculated: durationMinutes}
      - {parameter: price}

execution:
  interruptible: true