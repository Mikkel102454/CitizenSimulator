id: test.eat_food
handler: test.consume_food

parameters:
  portions: 1
  hungerRelief: 0.4
  targetHunger: 0.25
  durationMinutes: 1

preconditions:
  - op: gte
    args:
      - {fact: inventory.food_count}
      - {parameter: portions}
  - op: gt
    args:
      - {fact: needs.hunger}
      - {parameter: targetHunger}

duration:
  unit: simulationMinutes
  estimate: {parameter: durationMinutes}

prediction:
  - fact: inventory.food_count
    op: subtract
    value: {parameter: portions}
  - fact: needs.hunger
    op: set
    value:
      op: max
      args:
        - {literal: 0}
        - op: subtract
          args:
            - {fact: needs.hunger}
            - {parameter: hungerRelief}

completion:
  - op: lte
    args:
      - {fact: inventory.food_count}
      - op: subtract
        args:
          - {before: inventory.food_count}
          - {parameter: portions}
  - op: lte
    args:
      - {fact: needs.hunger}
      - op: max
        args:
          - {literal: 0}
          - op: subtract
            args:
              - {before: needs.hunger}
              - {parameter: hungerRelief}

cost:
  expression: {calculated: durationMinutes}

execution:
  interruptible: true
