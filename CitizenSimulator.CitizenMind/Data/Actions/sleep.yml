id: citizen_brain.core.sleep
handler: needs.sleep
# Sleep requires a usable home with a bed; outdoor resting remains available.
parameters:
  targetEnergy: {type: DOUBLE, value: "0.90"}
  recoveryPerMinute: {type: DOUBLE, value: "0.002"}
preconditions:
  - {fact: home.can_sleep}
  - {op: lt, args: [{fact: needs.energy}, {parameter: targetEnergy}]}
duration:
  unit: simulationMinutes
  estimate:
    op: divide
    args:
      - {op: subtract, args: [{parameter: targetEnergy}, {fact: needs.energy}]}
      - {op: add, args: [{parameter: recoveryPerMinute}, {fact: needs.energyChangePerMinute}]}
prediction:
  - {fact: needs.energy, op: set, value: {parameter: targetEnergy}}
completion:
  - {op: gte, args: [{fact: needs.energy}, {parameter: targetEnergy}]}
cost:
  expression: {calculated: durationMinutes}
execution:
  interruptible: true
  timeoutMinutes: 720
